name: G123

on:
  schedule:
    - cron: '0 */6 * * *'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  g123:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Configure Git
        run: |
          git config user.name "G123"
          git config user.email "G123@users.noreply.github.com"

      - name: G123
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          aider \
            --model openrouter/qwen/qwen3-coder:free \
            --yes-always \
            --no-pretty \
            --message "Review the repository for bugs, incomplete TODOs, or improvements. Implement one single high-impact improvement cleanly and commit it. If nothing needs changing, do nothing."

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "G123"
          title: "G123"
          body: "G123"
          branch: G123
          delete-branch: true
